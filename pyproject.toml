[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "json2gcs"
version = "0.1.0"
description = "Convert a Foundry VTT GURPS actor export back into a GCS character sheet"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.22"]

[project.scripts]
json2gcs = "json2gcs.cli:main"

[project.gui-scripts]
# The same entry point, without a console window attached on Windows.
json2gcs-gui = "json2gcs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The synthesize-mode template: GCS's own default sheet, captured from the
# application. Not optional -- `convert --synthesize` cannot run without it.
[tool.setuptools.package-data]
json2gcs = ["data/*.gcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
