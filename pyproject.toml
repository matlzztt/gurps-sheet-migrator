[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "json2gcs"
version = "0.2.0"
description = "Convert a Foundry VTT GURPS actor export back into a GCS character sheet"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "matlzztt" }]
keywords = ["gurps", "gcs", "foundry", "foundryvtt", "character-sheet", "rpg", "converter"]

# No `License ::` classifier: PEP 639 deprecates them, and setuptools>=77
# rejects one alongside the SPDX `license` expression above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/matlzztt/gurps-sheet-migrator"
Repository = "https://github.com/matlzztt/gurps-sheet-migrator"
Issues = "https://github.com/matlzztt/gurps-sheet-migrator/issues"
Changelog = "https://github.com/matlzztt/gurps-sheet-migrator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.22"]

[project.scripts]
json2gcs = "json2gcs.cli:main"

[project.gui-scripts]
# The same entry point, without a console window attached on Windows.
json2gcs-gui = "json2gcs.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The synthesize-mode template: GCS's own default sheet, captured from the
# application. Not optional -- `convert --synthesize` cannot run without it.
[tool.setuptools.package-data]
json2gcs = ["data/*.gcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
